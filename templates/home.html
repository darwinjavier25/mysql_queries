<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Plataforma de Aprendizaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero { height: 80vh; display:flex; align-items:center; justify-content:center; }
        .module-btn { min-width: 220px; padding: 1.25rem 2rem; font-size:1.1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">

        <a class="navbar-brand" href="/">Plataforma Multiaprendizaje</a>

        <div class="col-md-8 offset-md-2 text-center">

            <p class="lead mb-4">Selecciona el módulo con el que quieres practicar.</p>
            <div class="d-flex justify-content-center gap-3">

                    <i class="fas fa-database me-2"></i> Bases de datos
                </a>
                <a href="/entornos" class="btn btn-secondary module-btn">
